            <h1 class="font-display text-3xl sm:text-4xl font-bold text-white tracking-wide">
              My Gastronomy Itineraries
            </h1>
            <p class="text-sm text-[#8c8f9f] mt-1">
              Manage confirmed Michelin reservations, view digital passes, and access your private hotlist.
            </p>
          </div>

          <a href="restaurants.html" class="self-start sm:self-auto rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 px-5 py-2.5 text-xs font-bold text-black hover:brightness-110 shadow-lg block">

          </a>
        </div>

        <!-- Navigation Tabs -->
        <div class="mt-8 flex gap-3 border-b border-[#202334] pb-px">
          <button id="tab-btn-upcoming" onclick="setReservationsTab('upcoming')" class="flex items-center gap-2 pb-3 text-sm font-semibold border-b-2 border-amber-400 text-amber-300 transition-all cursor-pointer">
            <i data-lucide="calendar" class="h-4 w-4"></i>
            <span id="tab-label-upcoming">Upcoming Tables (0)</span>
          </button>

          <button id="tab-btn-saved" onclick="setReservationsTab('saved')" class="flex items-center gap-2 pb-3 text-sm font-semibold border-b-2 border-transparent text-[#8c8f9f] hover:text-white transition-all cursor-pointer">
            <i data-lucide="heart" class="h-4 w-4"></i>
            <span id="tab-label-saved">Saved Hotlist (0)</span>
          </button>

          <button id="tab-btn-past" onclick="setReservationsTab('past')" class="flex items-center gap-2 pb-3 text-sm font-semibold border-b-2 border-transparent text-[#8c8f9f] hover:text-white transition-all cursor-pointer">
            <i data-lucide="history" class="h-4 w-4"></i>
            <span id="tab-label-past">Dining History (0)</span>
          </button>

    <!-- Tab Contents Area -->
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 mt-10" id="reservations-content-area">

    </div>
