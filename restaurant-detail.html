<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Profile & Seating | Stackly Reserve</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-[#0b0c10] text-[#f3f4f6] antialiased selection:bg-amber-400 selection:text-black min-h-screen flex flex-col pb-24">

  <!-- Mount Navbar Header -->
  <div id="navbar-mount"></div>

  <main class="flex-1 w-full">
    
    <!-- TOP BACK NAVIGATION BAR -->
    <div class="border-b border-[#1c1d29] bg-[#0e1017] px-4 sm:px-6 lg:px-8 py-3.5">
      <div class="mx-auto max-w-7xl flex items-center justify-between">
        <a href="restaurants.html" class="flex items-center gap-2 text-xs font-semibold text-[#8c8f9f] hover:text-white transition-colors">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>
          <span>Back to All Restaurants</span>
        </a>

        <div class="flex items-center gap-3">
          <button id="detail-fav-btn" onclick="toggleDetailFav()" class="flex items-center gap-1.5 rounded-xl border border-[#282a3a] bg-[#141622] px-3 py-1.5 text-xs font-medium text-[#a1a1aa] hover:text-white transition-colors cursor-pointer">
            <i data-lucide="heart" class="h-3.5 w-3.5"></i>
            <span id="detail-fav-label">Save</span>
          </button>

          <button onclick="navigator.clipboard.writeText(window.location.href); store.showToast('Link Copied', 'Restaurant profile link copied to clipboard.', 'info');" class="flex items-center gap-1.5 rounded-xl border border-[#282a3a] bg-[#141622] px-3 py-1.5 text-xs font-medium text-[#a1a1aa] hover:text-white transition-colors cursor-pointer">
            <i data-lucide="share-2" class="h-3.5 w-3.5"></i>
            <span>Share</span>
          </button>
        </div>
      </div>
    </div>

    <!-- STAGE FOR RESTAURANT DETAIL -->
    <div id="restaurant-detail-stage">
      <!-- Rendered by JS -->
    </div>

  </main>

  <!-- Mount Footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/restaurant-detail.js"></script>
</body>
</html>
